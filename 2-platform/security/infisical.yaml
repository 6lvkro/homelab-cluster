# Infisical Ingress (차트의 ingress는 비활성화하고 직접 정의)
# 본체는 helm-releases.yaml의 HelmRelease가 배포한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical
  namespace: infisical
  labels:
    app: infisical
spec:
  ingressClassName: traefik
  rules:
    - host: ${SUB_INFISICAL}.${DOMAIN_LAN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infisical-infisical-standalone-infisical
                port:
                  number: 8080
